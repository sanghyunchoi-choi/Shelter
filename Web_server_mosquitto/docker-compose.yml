# Windows Docker Desktop: 경로에 ')' 문자가 있으면 bind mount 실패 가능
# → mosquitto.conf 는 Dockerfile.mosquitto 로 이미지에 포함 (볼륨 마운트 없음)

services:
  mosquitto:
    build:
      context: .
      dockerfile: Dockerfile.mosquitto
    image: shelter-mosquitto-local:2.0
    container_name: shelter-mosquitto
    ports:
      - "1883:1883"
    restart: always

  shelter-web:
    build: .
    image: shelter-web-local:2.0
    container_name: shelter-web-local
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MQTT_BROKER=mqtt://mosquitto:1883
      # Docker 내부 IP(172.x)가 아닌, 호스트 PC의 실제 LAN IP — install.bat 이 .env 에 자동 기록
      - SERVER_LAN_IP=${SERVER_LAN_IP}
    env_file:
      - .env
    depends_on:
      - mosquitto
    restart: always
